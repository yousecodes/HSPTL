name: HSPTL Windows clean-install and release verification

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clean-install-and-verify:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      HSPTL_NO_PAUSE: "1"
    steps:
      - name: Check out clean source tree
        uses: actions/checkout@v4

      - name: Set up supported 64-bit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up supported Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Assert clean Windows prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path .venv) { throw 'Clean-install check requires no pre-existing .venv.' }
          if (Test-Path frontend/node_modules) { throw 'Clean-install check requires no pre-existing frontend/node_modules.' }
          if (Test-Path frontend/dist) { throw 'Clean-install check requires no pre-existing frontend/dist.' }
          py -3.13 -c "import struct,sys; assert sys.version_info[:2] == (3,13); assert struct.calcsize('P') == 8"
          node -e "const [a,b]=process.versions.node.split('.').map(Number); if (!((a===20&&b>=19)||(a>=22&&(a>22||b>=12)))) process.exit(1)"
          npm --version

      - name: Run Windows installer (Python, dependencies, npm ci, typecheck and build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmd.exe /d /c install_hsptl.bat
          if ($LASTEXITCODE -ne 0) { throw "install_hsptl.bat failed with exit code $LASTEXITCODE" }

      - name: Run Windows startup preflight against isolated data home
        shell: pwsh
        env:
          HSPTL_HOME: ${{ runner.temp }}\hsptl-windows-clean-install
        run: |
          $ErrorActionPreference = 'Stop'
          & .\.venv\Scripts\python.exe scripts\startup_preflight.py
          if ($LASTEXITCODE -ne 0) { throw "Windows startup preflight failed with exit code $LASTEXITCODE" }

      - name: Run full Windows release checks and backend boot smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmd.exe /d /c check_hsptl.bat
          if ($LASTEXITCODE -ne 0) { throw "check_hsptl.bat failed with exit code $LASTEXITCODE" }

      - name: Verify frontend build output exists
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path frontend/dist/index.html)) { throw 'Vite production entrypoint is missing.' }
          if (-not (Test-Path .venv/Scripts/python.exe)) { throw 'Installed Windows virtual environment is missing.' }

      - name: Upload verified Windows production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hsptl-windows-python-3.13-production-build
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7
